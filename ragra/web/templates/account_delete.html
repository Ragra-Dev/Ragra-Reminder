<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ragra - Delete account</title>
{% include "_theme.html" %}
</head>
<body>
{% include "_nav.html" %}
<a class="back" href="/account">&larr; Back to account</a>
<div class="page-head"><div><h1>Delete this account</h1>
  <p class="sub">This cannot be undone. Everything listed below is removed immediately.</p></div></div>

<section class="danger">
  <pre>{% for line in lines %}{{ line }}
{% endfor %}</pre>

  <form method="post" action="/account/delete">
    <input type="hidden" name="csrf_token" value="{{ csrf_token_for(request) }}">
    <label>Type <strong>delete</strong> to confirm
      <input type="text" name="confirm" autocomplete="off" required>
    </label>
    <button class="btn-danger" type="submit">Permanently delete my account</button>
  </form>
</section>
</body>
</html>
