[project]
name = "ragra"
version = "0.1.0"
description = "Ragra Personal Edition - single-user academic operating system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    # Required for named IANA timezone resolution (zoneinfo). Windows ships
    # no system timezone database, and Ragra deliberately refuses to fall
    # back to a fixed UTC offset - see ragra/tz.py.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "python-multipart>=0.0.6",
]

[project.scripts]
ragra = "ragra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ragra*"]
