<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#5b5bf0">
<style>
  /* ---- design tokens ------------------------------------------------- */
  :root {
    --bg: #f5f6fb; --surface: #ffffff; --surface-2: #f6f7fc; --border: #e6e9f2; --border-strong: #d3d8e6;
    --text: #0f172a; --muted: #64708a; --faint: #94a0b8;
    --accent: #5b5bf0; --accent-2: #8b5cf6; --accent-ink: #ffffff; --accent-soft: #eeeefe;
    --grad: linear-gradient(135deg, #5b5bf0 0%, #8b5cf6 100%);
    --red: #d1343a; --red-soft: #fdecee; --amber: #9a6100; --amber-soft: #fff4d9;
    --green: #17803d; --green-soft: #e5f6ea; --blue: #2158d6; --blue-soft: #e8f0ff;
    --radius: 16px; --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(15,23,42,.05), 0 6px 20px -8px rgba(15,23,42,.08);
    --shadow-lift: 0 2px 4px rgba(15,23,42,.06), 0 14px 32px -10px rgba(91,91,240,.22);
    --glass: rgba(255,255,255,.78);
    --glow: radial-gradient(900px 380px at 50% -120px, rgba(91,91,240,.13), transparent 70%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e1a; --surface: #121929; --surface-2: #172036; --border: #232e47; --border-strong: #31405f;
      --text: #eaeefa; --muted: #98a4c0; --faint: #66738f;
      --accent: #8c8cff; --accent-2: #a78bfa; --accent-ink: #0a0e1a; --accent-soft: #232650;
      --grad: linear-gradient(135deg, #7c7cff 0%, #a78bfa 100%);
      --red: #ff8f95; --red-soft: #3a1d25; --amber: #f6c870; --amber-soft: #3a3018;
      --green: #75dd98; --green-soft: #153324; --blue: #94b8ff; --blue-soft: #19294d;
      --shadow: 0 1px 2px rgba(0,0,0,.35); --shadow-lift: 0 10px 30px -10px rgba(0,0,0,.6);
      --glass: rgba(18,25,41,.78);
      --glow: radial-gradient(900px 380px at 50% -120px, rgba(124,124,255,.2), transparent 70%);
    }
  }

  /* ---- base ---------------------------------------------------------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; padding: 84px 18px 72px; background: var(--glow) no-repeat, var(--bg); color: var(--text);
    font: 15px/1.55 Inter, "Inter var", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body > :not(.appbar):not(script) { max-width: 820px; margin-left: auto; margin-right: auto; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; transition: color .15s; }
  h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin: .5rem auto .3rem; }
  h2 { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    margin: 2.2rem auto .7rem; font-weight: 700; border: 0; padding: 0; display: flex; align-items: center; gap: .55rem; }
  h2::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--grad); flex: none; }
  p { margin: .55rem auto; }
  code { font: .82em ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface-2);
    border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; }
  ::selection { background: var(--accent-soft); }

  /* ---- app bar ------------------------------------------------------- */
  .appbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--glass);
    -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border); }
  .appbar-inner { max-width: 1040px; margin: 0 auto; padding: 10px 18px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.08rem;
    letter-spacing: -.02em; color: var(--text); text-decoration: none; }
  .logo { width: 32px; height: 32px; border-radius: 10px; background: var(--grad); color: #fff;
    display: grid; place-items: center; font-weight: 800; box-shadow: 0 6px 16px -6px rgba(91,91,240,.7); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { padding: 8px 13px; border-radius: 999px; color: var(--muted); text-decoration: none;
    font-size: .88rem; font-weight: 600; white-space: nowrap; transition: background .15s, color .15s; }
  .tabs a:hover { background: var(--surface-2); color: var(--text); }
  .tabs a.on { background: var(--accent-soft); color: var(--accent); }
  .nav-user { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); text-decoration: none; color: var(--text);
    transition: border-color .15s, box-shadow .15s; flex: none; }
  .nav-user:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .nav-user .who { display: flex; flex-direction: column; line-height: 1.15; max-width: 170px; }
  .nav-user .who b { font-size: .8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-user .who span { font-size: .7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; object-fit: cover; background: var(--grad); color: #fff;
    display: inline-grid; place-items: center; font-weight: 700; font-size: .85rem; }
  .avatar.lg { width: 76px; height: 76px; font-size: 2rem; box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--accent-soft); }

  /* ---- cards ----------------------------------------------------------- */
  .task, .item, .field, .reminder-row, .history-row, section, .priority {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .task { padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 14px;
    transition: transform .15s, box-shadow .15s, border-color .15s; }
  .task:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); border-color: var(--border-strong); }
  .task > div:first-child { min-width: 0; }
  .task a { color: var(--text); text-decoration: none; font-weight: 650; }
  .task a:hover { color: var(--accent); }
  .item { padding: 16px; margin-bottom: 12px; }
  .item .body { font-size: .92rem; margin: .55rem 0; white-space: pre-wrap; }
  .field { padding: 12px 16px; margin-bottom: 10px; }
  .field .label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  .reminder-row, .history-row { padding: 10px 16px; margin-bottom: 8px; font-size: .9rem; }
  .description { white-space: pre-wrap; }
  .course { color: var(--muted); margin-bottom: 1rem; }
  .meta, .hint { color: var(--muted); font-size: .84rem; }
  .hint { margin-top: .35rem; }
  .empty { color: var(--muted); background: transparent; border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius); padding: 16px; text-align: center; font-style: normal; }
  .priority { padding: 18px 20px; margin: 1.2rem auto; border-color: transparent; box-shadow: none;
    background: linear-gradient(135deg, var(--accent-soft), var(--surface-2)); border-left: 4px solid var(--accent); }
  .priority strong { color: var(--accent); }

  /* ---- hero + stats ---------------------------------------------------- */
  .hero { padding: 26px 24px; margin: .6rem auto 1.2rem; border-radius: 22px; color: #fff; position: relative; overflow: hidden;
    background: var(--grad); box-shadow: 0 18px 40px -18px rgba(91,91,240,.65); }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%;
    background: rgba(255,255,255,.12); }
  .hero h1 { color: #fff; margin: 0 0 .25rem; font-size: 1.75rem; position: relative; z-index: 1; }
  .hero p { margin: 0; opacity: .88; position: relative; z-index: 1; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 0 auto 1rem; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px 16px; text-decoration: none; color: var(--text); transition: transform .15s, box-shadow .15s; display: block; }
  .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .stat .n { display: block; font-size: 1.9rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .stat .l { display: block; font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-top: 2px; }
  .stat.bad .n { color: var(--red); } .stat.warn .n { color: var(--amber); } .stat.good .n { color: var(--green); } .stat.info .n { color: var(--accent); }

  /* ---- profile card ---------------------------------------------------- */
  .profile-card { display: flex; align-items: center; gap: 20px; padding: 22px; margin: .8rem auto 0; border-radius: 22px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .profile-card .info { min-width: 0; }
  .profile-card .name { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
  .profile-card .email { color: var(--muted); overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; padding: 3px 10px;
    border-radius: 999px; background: var(--green-soft); color: var(--green); margin-top: .5rem; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---- badges ---------------------------------------------------------- */
  .badge { display: inline-block; font-size: .7rem; padding: 2px 10px; border-radius: 999px; font-weight: 700; vertical-align: 1px; margin-right: 4px; }
  .badge.overdue, .badge.missed, .badge-reauth_required, .badge-config_error, .badge.status-MISSED { background: var(--red-soft); color: var(--red); }
  .badge.due, .badge-degraded { background: var(--amber-soft); color: var(--amber); }
  .badge.actual, .badge.status-DISCOVERED, .badge.status-ACTION_REQUIRED, .badge.status-PLANNED, .badge.status-IN_PROGRESS { background: var(--blue-soft); color: var(--blue); }
  .badge.personal { background: var(--accent-soft); color: var(--accent); }
  .badge.done, .badge.handled, .badge-healthy, .badge.status-COMPLETED { background: var(--green-soft); color: var(--green); }
  .badge-not_connected, .badge.status-CANCELLED { background: var(--surface-2); color: var(--muted); }
  .ok { color: var(--green); font-weight: 700; }
  .failed, .error { color: var(--red); font-weight: 600; }

  /* ---- controls -------------------------------------------------------- */
  button, .btn { cursor: pointer; font: inherit; font-size: .84rem; font-weight: 650; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text); border-radius: 999px; padding: 7px 16px; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .1s, box-shadow .15s; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: var(--surface-2); border-color: var(--muted); }
  button:active, .btn:active { transform: scale(.98); }
  section button[type=submit], .new-task button[type=submit], .btn-primary { background: var(--grad); border-color: transparent;
    color: #fff; margin-top: .9rem; box-shadow: 0 8px 18px -8px rgba(91,91,240,.7); }
  section button[type=submit]:hover, .btn-primary:hover { filter: brightness(1.07); background: var(--grad); border-color: transparent; }
  .task button[type=submit] { border-color: var(--green); color: var(--green); }
  .task button[type=submit]:hover { background: var(--green-soft); }
  input[type=text], input[type=date], input[type=email], select, textarea { font: inherit; font-size: .9rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 9px 12px;
    transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  section { padding: 20px; margin: 12px auto; }
  section label { display: block; font-size: .8rem; font-weight: 650; color: var(--muted); margin-top: .8rem; }
  section input[type=text], section textarea, section select { width: 100%; margin-top: 5px; }
  textarea { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: .85rem; }
  .checkbox-row { display: flex; align-items: center; gap: .55rem; margin-top: .7rem; }
  .checkbox-row label { margin: 0; color: var(--text); }
  .service-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--border); }
  .service-row:last-of-type { border-bottom: 0; }
  .service-row .name { font-weight: 750; margin-right: .4rem; }
  .status-line { padding: .25rem 0; }
  form.inline { display: inline; }
  form.inline input[type=date] { padding: 5px 8px; }
  .danger { background: var(--red-soft); border-color: transparent; box-shadow: none; }
  .danger a { color: var(--red); }
  .danger button, button.btn-danger { background: var(--red); border-color: var(--red); color: #fff; box-shadow: none; }
  .danger-heading { color: var(--red); }
  pre { white-space: pre-wrap; font: .85rem ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .85rem; }
  a.back { display: inline-block; color: var(--muted); font-size: .85rem; text-decoration: none; margin-top: .3rem; }
  a.back:hover { color: var(--accent); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; font-size: .88rem; margin-top: 1rem; box-shadow: var(--shadow); }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; background: var(--surface-2); }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--surface-2); }

  /* ---- public pages (landing, help, policy) ---------------------------- */
  .landing { text-align: center; padding: 44px 20px 30px; }
  .landing .logo { width: 56px; height: 56px; font-size: 1.6rem; border-radius: 16px; margin: 0 auto 1rem; }
  .landing h1 { font-size: 2.6rem; }
  .landing .lead { font-size: 1.12rem; color: var(--muted); max-width: 520px; margin: .6rem auto 1.4rem; }
  .cta { display: inline-block; padding: .8rem 1.6rem; background: var(--grad); color: #fff; border-radius: 999px;
    text-decoration: none; font-weight: 700; box-shadow: 0 14px 28px -12px rgba(91,91,240,.8); transition: transform .15s, filter .15s; }
  .cta:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 1.4rem auto; text-align: left; }
  .feature { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .feature b { display: block; margin-bottom: 4px; }
  .feature span { color: var(--muted); font-size: .9rem; }
  .doc { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 10px 28px 24px; box-shadow: var(--shadow); }
  .doc h1 { margin-top: 1.3rem; }
  .foot { text-align: center; color: var(--muted); font-size: .84rem; margin-top: 1.6rem; }
  .foot a { color: var(--muted); }

  @media (max-width: 640px) {
    body { padding: 76px 14px 56px; }
    h1 { font-size: 1.65rem; }
    .task { flex-direction: column; align-items: stretch; }
    .brand span:not(.logo) { display: none; }
    .nav-user .who { display: none; } .nav-user { padding: 3px; }
    .profile-card { flex-direction: column; text-align: center; }
    .service-row { flex-direction: column; align-items: flex-start; }
    .landing h1 { font-size: 2rem; }
    .features { grid-template-columns: 1fr; }
    .doc { padding: 6px 18px 20px; }
    table { display: block; overflow-x: auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
