<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F7FD">
<style>
  /* ======================================================================
     Ragra design system - blue + emerald on ink navy, clay surfaces, glass overlays.
       clay  = solid, soft, inflated: cards, buttons, tiles, icon wells
       glass = translucent, floating: top bar, dock, tab strip, hero panel
     Spacing scale: 4 / 8 / 12 / 16 / 24 / 32 / 48 (--s1 ... --s7).
     ====================================================================== */
  :root {
    /* Blue acts, emerald confirms, red warns. Ink-navy text on cool paper. */
    --primary: #3560E8; --primary-soft: #6C8CFF; --primary-light: #E3EBFF; --primary-deep: #2447C4;
    --secondary: #10B981; --secondary-soft: #6EE7B7; --secondary-light: #D8F7EA; --secondary-deep: #047857;
    --bg: #F4F7FD; --bg-2: #E9EFFA;
    --text: #0E1A3A; --muted: #56638A; --faint: #8D99B8;
    --surface: #ffffff; --surface-2: #edf1fb; --line: rgba(14,26,58,.09);
    --clay: linear-gradient(145deg, #ffffff 0%, #edf1fb 100%);
    --glass: rgba(255,255,255,.64); --glass-edge: rgba(255,255,255,.82);
    --grad: linear-gradient(135deg, #3560E8 0%, #10B981 140%);
    --primary-clay: linear-gradient(145deg, #6C8CFF 0%, #3560E8 55%, #2447C4 100%);
    --secondary-clay: linear-gradient(145deg, #34D399 0%, #10B981 50%, #047857 100%);
    --accent: var(--primary-deep); --accent-soft: var(--primary-light); --accent-ink: #fff;
    --red: #D62F3A; --red-soft: #FFE4E6; --amber: #9A5B00; --amber-soft: #FFF1CF;
    --green: var(--secondary-deep); --green-soft: var(--secondary-light); --blue: var(--primary-deep); --blue-soft: var(--primary-light);
    --r-lg: 30px; --r-md: 22px; --r-sm: 14px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    /* clay depth: light from the upper left */
    --clay-shadow:
      12px 16px 30px -10px rgba(36,71,200,.22),
      -8px -8px 18px rgba(255,255,255,.95),
      inset 2px 3px 6px rgba(255,255,255,.95),
      inset -4px -6px 12px rgba(59,100,240,.10);
    --clay-shadow-sm:
      7px 9px 18px -8px rgba(36,71,200,.22),
      -5px -5px 12px rgba(255,255,255,.95),
      inset 1px 2px 4px rgba(255,255,255,.95),
      inset -3px -4px 8px rgba(59,100,240,.09);
    --clay-press: inset 4px 5px 10px rgba(36,71,200,.16), inset -3px -3px 8px rgba(255,255,255,.9);
    --clay-primary-shadow:
      0 14px 24px -10px rgba(36,71,200,.7), inset 3px 4px 8px rgba(255,255,255,.45), inset -4px -6px 10px rgba(20,40,130,.34);
    --clay-secondary-shadow:
      0 14px 24px -10px rgba(4,120,87,.65), inset 3px 4px 8px rgba(255,255,255,.45), inset -4px -6px 10px rgba(3,80,58,.32);
    --ambient:
      radial-gradient(640px 420px at 8% -6%, rgba(59,100,240,.18), transparent 70%),
      radial-gradient(720px 480px at 100% 4%, rgba(16,185,129,.14), transparent 70%),
      radial-gradient(520px 420px at 50% 108%, rgba(108,140,255,.14), transparent 70%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1024; --bg-2: #0e1733;
      --text: #e8eeff; --muted: #98a5cc; --faint: #62709b;
      --surface: #121c3a; --surface-2: #0e1733; --line: rgba(232,238,255,.09);
      --clay: linear-gradient(145deg, #182648 0%, #121c3a 100%);
      --glass: rgba(14,23,51,.68); --glass-edge: rgba(150,175,255,.16);
      /* text-weight blues and greens need to be light on a dark surface */
      --primary-deep: #9db6ff; --primary-light: rgba(108,140,255,.20);
      --secondary-deep: #6ee7b7; --secondary-light: rgba(16,185,129,.20);
      --accent: var(--primary-soft); --accent-soft: rgba(108,140,255,.18);
      --red: #ff9aa2; --red-soft: rgba(255,90,105,.18); --amber: #f4c36a; --amber-soft: rgba(244,195,106,.16);
      --green: var(--secondary-soft); --green-soft: rgba(16,185,129,.18); --blue: #9db6ff; --blue-soft: rgba(108,140,255,.18);
      --clay-shadow:
        12px 16px 30px -10px rgba(0,0,0,.6), -6px -6px 16px rgba(108,140,255,.06),
        inset 2px 3px 6px rgba(150,175,255,.10), inset -4px -6px 12px rgba(0,0,0,.28);
      --clay-shadow-sm:
        7px 9px 18px -8px rgba(0,0,0,.55), -4px -4px 10px rgba(108,140,255,.05),
        inset 1px 2px 4px rgba(150,175,255,.10), inset -3px -4px 8px rgba(0,0,0,.25);
      --clay-press: inset 4px 5px 10px rgba(0,0,0,.45), inset -3px -3px 8px rgba(108,140,255,.07);
      --ambient:
        radial-gradient(640px 420px at 8% -6%, rgba(59,100,240,.28), transparent 70%),
        radial-gradient(720px 480px at 100% 4%, rgba(16,185,129,.16), transparent 70%),
        radial-gradient(520px 420px at 50% 108%, rgba(36,71,200,.30), transparent 70%);
    }
  }

  /* ---- base ------------------------------------------------------------ */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; padding: 96px var(--s4) 64px; color: var(--text); min-height: 100vh;
    background: var(--ambient) no-repeat, linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%) fixed;
    font: 15px/1.6 "Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
  body > :not(.appbar):not(.dock):not(script) { max-width: 840px; margin-left: auto; margin-right: auto; }
  a { color: var(--accent); text-underline-offset: 3px; transition: color .15s; }
  h1 { font-size: clamp(1.7rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -.025em; line-height: 1.15; margin: var(--s2) auto var(--s2); }
  h2 { font-size: 1.1rem; font-weight: 800; letter-spacing: -.01em; margin: 0; }
  h3 { font-size: .82rem; font-weight: 800; color: var(--muted); letter-spacing: .02em; margin: var(--s5) 0 var(--s3); }
  p { margin: var(--s2) auto; }
  code { font: .82em ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface-2); box-shadow: var(--clay-press); padding: 2px 8px; border-radius: 8px; }
  ::selection { background: var(--primary-light); color: var(--primary-deep); }

  /* ---- glass: top bar, dock, tab strip ------------------------------------ */
  .appbar { position: fixed; top: var(--s3); left: var(--s3); right: var(--s3); z-index: 30; }
  .appbar-inner { max-width: 1040px; margin: 0 auto; padding: var(--s2) var(--s2) var(--s2) var(--s4); display: flex; align-items: center; gap: var(--s4);
    background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px;
    box-shadow: 0 10px 30px -12px rgba(36,71,200,.28), inset 0 1px 0 rgba(255,255,255,.7);
    -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.08rem; letter-spacing: -.02em; color: var(--text); text-decoration: none; }
  .logo { width: 36px; height: 36px; border-radius: 13px; background: var(--primary-clay); color: #fff; display: grid; place-items: center;
    font-weight: 800; box-shadow: var(--clay-primary-shadow); }
  .tabs { display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; flex: 1; justify-content: center; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px; color: var(--muted);
    text-decoration: none; font-size: .86rem; font-weight: 700; white-space: nowrap; transition: background .18s, color .18s, box-shadow .18s; }
  .tabs a svg { width: 17px; height: 17px; }
  .tabs a:hover { color: var(--text); background: rgba(59,100,240,.10); }
  .tabs a.on { background: var(--clay); color: var(--primary-deep); box-shadow: var(--clay-shadow-sm); }
  .nav-user { display: flex; align-items: center; gap: 9px; padding: 3px 14px 3px 3px; border-radius: 999px; text-decoration: none; color: var(--text);
    background: var(--clay); box-shadow: var(--clay-shadow-sm); flex: none; transition: transform .15s; }
  .nav-user:hover { transform: translateY(-1px); }
  .nav-user .who { display: flex; flex-direction: column; line-height: 1.15; max-width: 160px; }
  .nav-user .who b { font-size: .78rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-user .who span { font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; object-fit: cover; background: var(--secondary-clay); color: #fff;
    display: inline-grid; place-items: center; font-weight: 800; font-size: .88rem; }
  .avatar.lg { width: 88px; height: 88px; font-size: 2.2rem; box-shadow: var(--clay-shadow-sm), 0 0 0 5px var(--surface); }
  .dock { display: none; }

  /* ---- clay: cards ----------------------------------------------------------- */
  .task, .item, .field, .reminder-row, .history-row, section, .priority, .fold, .profile-card, .stat, .feature, .doc, .clay {
    background: var(--clay); border-radius: var(--r-md); box-shadow: var(--clay-shadow-sm); }
  .task { padding: var(--s4) var(--s5); margin-bottom: var(--s3); display: flex; justify-content: space-between; align-items: center; gap: var(--s4);
    transition: transform .18s, box-shadow .18s; }
  .task:hover { transform: translateY(-2px); box-shadow: var(--clay-shadow); }
  .task > div:first-child { min-width: 0; }
  .task a { color: var(--text); text-decoration: none; font-weight: 700; }
  .task a:hover { color: var(--primary-deep); }
  .item { padding: var(--s5); margin-bottom: var(--s4); }
  .item .body { font-size: .92rem; margin: var(--s3) 0; white-space: pre-wrap; }
  .field { padding: var(--s4) var(--s5); margin-bottom: var(--s3); }
  .field .label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; margin-bottom: 2px; }
  .reminder-row, .history-row { padding: var(--s3) var(--s5); margin-bottom: var(--s2); font-size: .9rem; }
  .description { white-space: pre-wrap; }
  .course { color: var(--muted); margin-bottom: var(--s4); font-weight: 600; }
  .meta, .hint { color: var(--muted); font-size: .84rem; }
  .hint { margin-top: var(--s2); }
  .empty { color: var(--muted); background: var(--surface-2); box-shadow: var(--clay-press); border-radius: var(--r-md); padding: var(--s5); text-align: center; font-style: normal; }
  .priority { padding: var(--s4) var(--s5); margin: var(--s4) auto; border-left: 6px solid var(--primary); }
  .priority strong { color: var(--primary-deep); }

  /* ---- section heading with a link on the right ---------------------------- */
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin: var(--s6) auto var(--s3); }
  .see-all { font-size: .84rem; font-weight: 800; text-decoration: none; color: var(--primary-deep); white-space: nowrap; }
  .see-all::after { content: " \203A"; }
  .crs { color: var(--muted); font-size: .78rem; font-weight: 800; margin-right: 6px; }
  .cnt { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 8px; margin-left: 6px; border-radius: 999px;
    background: var(--primary-light); color: var(--primary-deep); font-size: .72rem; font-weight: 800; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s4); }
  .page-head h1 { margin: 0; }
  .page-head > .cnt { margin: 0 0 6px; }
  .page-head .sub { color: var(--muted); font-size: .9rem; margin: var(--s1) 0 0; }

  /* ---- hero: blue clay, an emerald blob, and a glass panel floating on it ---------- */
  .hero { position: relative; overflow: hidden; margin: var(--s2) auto var(--s5); padding: var(--s6) var(--s6); border-radius: 36px; color: #fff;
    background: radial-gradient(circle 190px at 104% 128%, #10B981 0, #10B981 98%, transparent 100%),
      linear-gradient(135deg, #5B82FF 0%, #3560E8 58%, #2447C4 100%);
    box-shadow: 0 26px 46px -22px rgba(36,71,200,.7), inset 4px 6px 12px rgba(255,255,255,.35), inset -8px -12px 22px rgba(10,25,90,.32); }
  .hero-grid { position: relative; z-index: 2; display: grid; grid-template-columns: 1.1fr .9fr; gap: var(--s5); align-items: center; }
  .hero h1 { color: #fff; margin: 0 0 var(--s2); font-size: clamp(1.8rem, 4.5vw, 2.4rem); text-shadow: 0 2px 10px rgba(15,60,56,.25); }
  .hero p { margin: 0; color: rgba(255,255,255,.92); font-weight: 600; }
  .hero .glass { padding: var(--s4) var(--s5); border-radius: var(--r-md); color: #fff; font-size: .9rem;
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.45);
    box-shadow: 0 12px 28px -14px rgba(10,25,90,.55), inset 0 1px 0 rgba(255,255,255,.5);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transform: rotate(1.2deg); }
  .hero .glass b { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; opacity: .85; margin-bottom: 2px; }
  .hero .glass .meta { color: rgba(255,255,255,.85); }
  .orb { position: absolute; border-radius: 50%; z-index: 1; pointer-events: none;
    box-shadow: inset 6px 8px 14px rgba(255,255,255,.55), inset -10px -14px 22px rgba(0,0,0,.18), 0 18px 30px -16px rgba(0,0,0,.35); }
  .orb.o1 { width: 120px; height: 120px; right: -26px; top: -30px; background: radial-gradient(circle at 30% 28%, #d7fbe9, #6EE7B7 70%); }
  .orb.o2 { width: 70px; height: 70px; right: 140px; bottom: -22px; background: radial-gradient(circle at 30% 28%, #ffffff, #cfdcff 72%); }
  .orb.o3 { width: 38px; height: 38px; left: 46%; top: 14px; background: radial-gradient(circle at 30% 28%, #ffffff, #dbe5ff 75%); opacity: .9; }

  /* ---- stat tiles ------------------------------------------------------------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s4); margin: 0 auto var(--s4); }
  .stat { border-radius: var(--r-md); padding: var(--s4) var(--s3); text-decoration: none; color: var(--text); text-align: center; display: block;
    transition: transform .18s, box-shadow .18s; }
  .stat:hover { transform: translateY(-3px); box-shadow: var(--clay-shadow); }
  .stat .ico { width: 46px; height: 46px; margin: 0 auto var(--s2); border-radius: 16px; display: grid; place-items: center;
    background: var(--surface-2); box-shadow: var(--clay-press); color: var(--primary-deep); }
  .stat .ico svg { width: 21px; height: 21px; }
  .stat .n { display: block; font-size: 1.8rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .stat .l { display: block; font-size: .72rem; font-weight: 800; color: var(--muted); margin-top: 3px; }
  .stat.bad .n, .stat.bad .ico { color: var(--red); }
  .stat.warn .n, .stat.warn .ico { color: var(--amber); }
  .stat.good .n, .stat.good .ico { color: var(--secondary-deep); }

  /* ---- profile card ---------------------------------------------------------- */
  .profile-card { display: flex; align-items: center; gap: var(--s5); padding: var(--s5) var(--s6); margin: var(--s3) auto 0; border-radius: var(--r-lg); box-shadow: var(--clay-shadow); }
  .profile-card .info { min-width: 0; }
  .profile-card .name { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
  .profile-card .email { color: var(--muted); overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 800; padding: 4px 12px; border-radius: 999px;
    background: var(--secondary-light); color: var(--secondary-deep); margin-top: var(--s2); }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---- badges --------------------------------------------------------------- */
  .badge { display: inline-block; font-size: .7rem; padding: 3px 11px; border-radius: 999px; font-weight: 800; vertical-align: 1px; margin-right: 4px; }
  .badge.overdue, .badge.missed, .badge-reauth_required, .badge-config_error, .badge.status-MISSED { background: var(--red-soft); color: var(--red); }
  .badge.due, .badge-degraded { background: var(--amber-soft); color: var(--amber); }
  .badge.actual, .badge.status-DISCOVERED, .badge.status-ACTION_REQUIRED, .badge.status-PLANNED, .badge.status-IN_PROGRESS { background: var(--blue-soft); color: var(--blue); }
  .badge.personal { background: var(--primary-light); color: var(--primary-deep); }
  .badge.done, .badge.handled, .badge-healthy, .badge.status-COMPLETED { background: var(--secondary-light); color: var(--secondary-deep); }
  .badge-not_connected, .badge.status-CANCELLED { background: var(--surface-2); color: var(--muted); }
  .ok { color: var(--secondary-deep); font-weight: 800; }
  .failed, .error { color: var(--red); font-weight: 700; }

  /* ---- buttons: pressable clay -------------------------------------------- */
  button, .btn { cursor: pointer; font: inherit; font-size: .86rem; font-weight: 800; border: 0; color: var(--primary-deep);
    background: var(--clay); border-radius: 999px; padding: 10px 20px; white-space: nowrap; box-shadow: var(--clay-shadow-sm);
    transition: box-shadow .16s, transform .12s, filter .16s; text-decoration: none; display: inline-block; letter-spacing: .005em; }
  button:hover, .btn:hover { transform: translateY(-2px); box-shadow: var(--clay-shadow); }
  button:active, .btn:active { transform: translateY(1px) scale(.985); box-shadow: var(--clay-press); }
  /* primary: blue */
  section button[type=submit], .new-task button[type=submit], .btn-primary, .fold button[type=submit] {
    background: var(--primary-clay); color: #fff; box-shadow: var(--clay-primary-shadow); text-shadow: 0 1px 2px rgba(20,40,130,.35); margin-top: var(--s4); }
  section button[type=submit]:hover, .btn-primary:hover, .fold button[type=submit]:hover { filter: brightness(1.05); box-shadow: var(--clay-primary-shadow); }
  /* secondary: emerald */
  .btn-secondary, .task button[type=submit] { background: var(--secondary-clay); color: #fff; box-shadow: var(--clay-secondary-shadow); text-shadow: 0 1px 2px rgba(3,80,58,.35); margin-top: 0; }
  .btn-secondary:hover, .task button[type=submit]:hover { filter: brightness(1.05); box-shadow: var(--clay-secondary-shadow); }
  .btn-ghost { background: transparent; box-shadow: none; color: var(--muted); }
  .danger button, button.btn-danger { background: linear-gradient(145deg, #f0646e, #D62F3A); color: #fff; box-shadow: 0 14px 24px -10px rgba(214,47,58,.65), inset 3px 4px 8px rgba(255,255,255,.4), inset -4px -6px 10px rgba(120,15,25,.34); margin-top: 0; }

  /* ---- inputs: pressed into the clay ---------------------------------------- */
  input[type=text], input[type=date], input[type=email], select, textarea { font: inherit; font-size: .92rem; color: var(--text); width: auto; max-width: 100%;
    background: var(--surface-2); border: 2px solid transparent; border-radius: var(--r-sm); padding: 11px 14px; box-shadow: var(--clay-press);
    transition: border-color .15s, box-shadow .15s; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--clay-press), 0 0 0 4px rgba(59,100,240,.20); }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  input[type=checkbox] { accent-color: var(--primary); width: 18px; height: 18px; }
  section { padding: var(--s5); margin: var(--s3) auto; border-radius: var(--r-lg); box-shadow: var(--clay-shadow); }
  section label, .fold label, .new-task label { display: block; font-size: .8rem; font-weight: 800; color: var(--muted); margin-top: var(--s4); }
  section input[type=text], section textarea, section select, .fold form input[type=text], .fold form textarea, .fold form select,
  .new-task input[type=text], .new-task textarea { width: 100%; margin-top: 6px; }
  textarea { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: .85rem; }
  .checkbox-row { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3); }
  .checkbox-row label { margin: 0; color: var(--text); }
  .service-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); padding: var(--s4) 0; border-bottom: 1px solid var(--line); }
  .service-row:last-of-type { border-bottom: 0; }
  .service-row .name { font-weight: 800; margin-right: 6px; }
  form.inline { display: inline; }
  form.inline input[type=date] { padding: 6px 10px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-top: var(--s3); }
  .danger { background: var(--red-soft); }
  .danger a { color: var(--red); }
  .danger-heading { color: var(--red); }
  .danger-fold { background: linear-gradient(145deg, #fff0f1, #ffdde0); }
  @media (prefers-color-scheme: dark) { .danger, .danger-fold { background: linear-gradient(145deg, #3a1d27, #2b1520); } }
  pre { white-space: pre-wrap; font: .85rem ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface-2); box-shadow: var(--clay-press); border-radius: var(--r-sm); padding: var(--s4); }
  a.back { display: flex; align-items: center; gap: 6px; width: fit-content; margin-left: max(0px, calc((100% - 840px) / 2)); color: var(--muted); font-size: .86rem; font-weight: 700; text-decoration: none; margin-bottom: var(--s2); }
  a.back:hover { color: var(--primary-deep); }

  /* ---- tables as clay -------------------------------------------------------- */
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--clay); border-radius: var(--r-md); overflow: hidden; font-size: .88rem; box-shadow: var(--clay-shadow-sm); }
