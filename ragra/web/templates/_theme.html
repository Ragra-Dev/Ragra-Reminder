<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eceffa">
<style>
  /* ---- soft-UI tokens ---------------------------------------------------
     Pale lavender surfaces that look gently raised or pressed in, one deep
     navy accent panel per page, and a single violet gradient for actions.   */
  :root {
    --bg: #e9edf8; --bg-2: #f5f3fc;
    --surface: #f3f5fc; --surface-2: #eaedf8; --card: linear-gradient(145deg, #ffffff 0%, #eef1fa 100%);
    --border: rgba(255,255,255,.7); --line: #dde2f1;
    --text: #1e2447; --muted: #7a83a6; --faint: #a3abc8;
    --accent: #6c63f5; --accent-2: #9a85ff; --accent-ink: #ffffff; --accent-soft: #e6e4fd;
    --grad: linear-gradient(135deg, #6c63f5 0%, #9a85ff 100%);
    --navy: linear-gradient(150deg, #1d2352 0%, #2f3485 100%);
    --red: #d6454f; --red-soft: #fde9ec; --amber: #a86a00; --amber-soft: #fff1d3;
    --green: #1a8a48; --green-soft: #def5e7; --blue: #2c5fd9; --blue-soft: #e4edff;
    --radius: 26px; --radius-sm: 16px;
    --raise: 9px 9px 22px rgba(147,160,201,.34), -9px -9px 22px rgba(255,255,255,.95);
    --raise-sm: 5px 5px 12px rgba(147,160,201,.3), -5px -5px 12px rgba(255,255,255,.95);
    --inset: inset 4px 4px 9px rgba(147,160,201,.3), inset -4px -4px 9px rgba(255,255,255,.95);
    --glow: radial-gradient(700px 420px at 12% -8%, rgba(154,133,255,.22), transparent 70%),
            radial-gradient(640px 420px at 100% 8%, rgba(108,99,245,.14), transparent 70%);
    --dock-bg: rgba(243,245,252,.86);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1130; --bg-2: #141845;
      --surface: #171b47; --surface-2: #1d2255; --card: linear-gradient(145deg, #1c2152 0%, #161a44 100%);
      --border: rgba(120,128,220,.14); --line: #262c63;
      --text: #eceffd; --muted: #9aa3d2; --faint: #6c75a8;
      --accent: #8f8cff; --accent-2: #b4a4ff; --accent-ink: #0e1130; --accent-soft: #2a2e6e;
      --grad: linear-gradient(135deg, #7d78ff 0%, #a98fff 100%);
      --navy: linear-gradient(150deg, #232a73 0%, #3a3fa0 100%);
      --red: #ff8f99; --red-soft: #3d1f33; --amber: #f6c870; --amber-soft: #3b3220;
      --green: #7ae0a0; --green-soft: #17382f; --blue: #9cbcff; --blue-soft: #1c2c5c;
      --raise: 9px 9px 22px rgba(3,5,24,.65), -7px -7px 18px rgba(70,78,160,.16);
      --raise-sm: 5px 5px 12px rgba(3,5,24,.55), -4px -4px 10px rgba(70,78,160,.14);
      --inset: inset 4px 4px 9px rgba(3,5,24,.55), inset -3px -3px 8px rgba(70,78,160,.14);
      --glow: radial-gradient(700px 420px at 12% -8%, rgba(125,120,255,.28), transparent 70%),
              radial-gradient(640px 420px at 100% 8%, rgba(169,143,255,.16), transparent 70%);
      --dock-bg: rgba(20,24,69,.88);
    }
  }

  /* ---- base ---------------------------------------------------------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; padding: 92px 18px 56px; color: var(--text); background: var(--glow) no-repeat,
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 60%) fixed;
    font: 15px/1.55 Inter, "Inter var", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; min-height: 100vh; }
  body > :not(.appbar):not(.dock):not(script) { max-width: 800px; margin-left: auto; margin-right: auto; }
  a { color: var(--accent); text-underline-offset: 2px; transition: color .15s; }
  h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin: .5rem auto .3rem; }
  h2 { font-size: 1.05rem; font-weight: 750; letter-spacing: -.01em; color: var(--text); margin: 2rem auto .8rem; border: 0; padding: 0; }
  p { margin: .55rem auto; }
  code { font: .82em ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface-2); box-shadow: var(--inset);
    padding: 2px 8px; border-radius: 8px; }
  ::selection { background: var(--accent-soft); }

  /* ---- top bar + dock -------------------------------------------------- */
  .appbar { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 20; }
  .appbar-inner { max-width: 1000px; margin: 0 auto; padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 14px;
    background: var(--dock-bg); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--raise-sm);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; letter-spacing: -.02em; color: var(--text); text-decoration: none; }
  .logo { width: 34px; height: 34px; border-radius: 12px; background: var(--grad); color: #fff; display: grid; place-items: center;
    font-weight: 800; box-shadow: 0 8px 18px -6px rgba(108,99,245,.75); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; justify-content: center; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; color: var(--muted);
    text-decoration: none; font-size: .86rem; font-weight: 650; white-space: nowrap; transition: all .18s; }
  .tabs a svg { width: 17px; height: 17px; }
  .tabs a:hover { color: var(--text); }
  .tabs a.on { background: var(--surface); color: var(--accent); box-shadow: var(--inset); }
  .nav-user { display: flex; align-items: center; gap: 9px; padding: 3px 12px 3px 3px; border-radius: 999px; text-decoration: none;
    color: var(--text); background: var(--surface); box-shadow: var(--raise-sm); flex: none; transition: transform .15s; }
  .nav-user:hover { transform: translateY(-1px); }
  .nav-user .who { display: flex; flex-direction: column; line-height: 1.15; max-width: 160px; }
  .nav-user .who b { font-size: .78rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-user .who span { font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; object-fit: cover; background: var(--grad); color: #fff;
    display: inline-grid; place-items: center; font-weight: 700; font-size: .85rem; }
  .avatar.lg { width: 84px; height: 84px; font-size: 2.1rem; box-shadow: var(--raise-sm), 0 0 0 5px var(--surface); }

  .dock { display: none; }

  /* ---- cards: soft, raised ------------------------------------------- */
  .task, .item, .field, .reminder-row, .history-row, section, .priority {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--raise-sm); }
  .task { padding: 16px 18px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 14px;
    transition: transform .18s, box-shadow .18s; }
  .task:hover { transform: translateY(-2px); box-shadow: var(--raise); }
  .task > div:first-child { min-width: 0; }
  .task a { color: var(--text); text-decoration: none; font-weight: 650; }
  .task a:hover { color: var(--accent); }
  .item { padding: 18px; margin-bottom: 14px; }
  .item .body { font-size: .92rem; margin: .55rem 0; white-space: pre-wrap; }
  .field { padding: 14px 18px; margin-bottom: 12px; }
  .field .label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  .reminder-row, .history-row { padding: 12px 18px; margin-bottom: 10px; font-size: .9rem; }
  .description { white-space: pre-wrap; }
  .course { color: var(--muted); margin-bottom: 1rem; }
  .meta, .hint { color: var(--muted); font-size: .84rem; }
  .hint { margin-top: .35rem; }
  .empty { color: var(--muted); background: var(--surface); box-shadow: var(--inset); border-radius: var(--radius);
    padding: 18px; text-align: center; font-style: normal; }
  .priority { padding: 18px 22px; margin: 1.2rem auto; background: var(--card); border-left: 5px solid var(--accent); }
  .priority strong { color: var(--accent); }

  /* ---- section headings with a "view all" link, like the samples ------- */
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 2rem auto .8rem; }
  .sec-head h2 { margin: 0; }
  .see-all { font-size: .82rem; font-weight: 650; text-decoration: none; color: var(--accent); }
  .see-all::after { content: " \203A"; }
  .crs { color: var(--muted); font-size: .8rem; font-weight: 650; margin-right: .35rem; }
  h3 { font-size: .8rem; font-weight: 700; color: var(--muted); margin: 1.2rem 0 .6rem; }
  .cnt { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 7px; margin-left: 6px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: .72rem; font-weight: 750; }

  /* ---- segmented tabs (pure CSS) ---------------------------------------- */
  .tabset > input { position: absolute; opacity: 0; pointer-events: none; }
  .seg { display: flex; gap: 6px; padding: 6px; margin-bottom: 14px; border-radius: 999px; background: var(--surface);
    box-shadow: var(--inset); overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg label { flex: 1; text-align: center; white-space: nowrap; padding: 9px 14px; border-radius: 999px; cursor: pointer;
    font-size: .84rem; font-weight: 650; color: var(--muted); transition: all .18s; }
  .seg label:hover { color: var(--text); }
  .seg label .cnt { margin-left: 5px; background: var(--surface-2); color: var(--muted); }
  .panel { display: none; }
  #dl-overdue:checked ~ .seg label[for=dl-overdue], #dl-today:checked ~ .seg label[for=dl-today],
  #dl-soon:checked ~ .seg label[for=dl-soon], #dl-missed:checked ~ .seg label[for=dl-missed] {
    background: var(--card); color: var(--accent); box-shadow: var(--raise-sm); }
  #dl-overdue:checked ~ .seg label[for=dl-overdue] .cnt, #dl-today:checked ~ .seg label[for=dl-today] .cnt,
  #dl-soon:checked ~ .seg label[for=dl-soon] .cnt, #dl-missed:checked ~ .seg label[for=dl-missed] .cnt { background: var(--accent-soft); color: var(--accent); }
  #dl-overdue:checked ~ .panels [data-for=dl-overdue], #dl-today:checked ~ .panels [data-for=dl-today],
  #dl-soon:checked ~ .panels [data-for=dl-soon], #dl-missed:checked ~ .panels [data-for=dl-missed] { display: block; }
  #dl-overdue:focus-visible ~ .seg label[for=dl-overdue], #dl-today:focus-visible ~ .seg label[for=dl-today],
  #dl-soon:focus-visible ~ .seg label[for=dl-soon], #dl-missed:focus-visible ~ .seg label[for=dl-missed] { outline: 2px solid var(--accent); }

  /* ---- collapsible cards ------------------------------------------------ */
  .fold { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--raise-sm);
    margin-bottom: 14px; padding: 0 18px; }
  .fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; font-weight: 700; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::after { content: "\203A"; font-size: 1.4rem; color: var(--muted); transition: transform .2s; margin-left: 10px; }
  .fold[open] > summary::after { transform: rotate(90deg); }
  .fold > summary span { flex: 1; }
  .fold[open] { padding-bottom: 14px; }

  /* ---- hero (the one deep-navy panel) and stat tiles ------------------ */
  .hero { padding: 28px 26px; margin: .4rem auto 1.4rem; border-radius: 32px; color: #fff; position: relative; overflow: hidden;
    background: var(--navy); box-shadow: 0 22px 44px -20px rgba(29,35,82,.75); }
  .hero::before { content: ""; position: absolute; right: -40px; top: -70px; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(154,133,255,.55), transparent 70%); }
  .hero::after { content: ""; position: absolute; left: -30px; bottom: -90px; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%); }
  .hero h1 { color: #fff; margin: 0 0 .3rem; font-size: 1.8rem; position: relative; z-index: 1; }
  .hero p { margin: 0; color: rgba(255,255,255,.78); position: relative; z-index: 1; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 0 auto 1rem; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--raise-sm);
    padding: 16px 14px; text-decoration: none; color: var(--text); text-align: center; transition: transform .18s, box-shadow .18s; display: block; }
  .stat:hover { transform: translateY(-2px); box-shadow: var(--raise); }
  .stat .ico { width: 44px; height: 44px; margin: 0 auto 8px; border-radius: 15px; display: grid; place-items: center;
    background: var(--surface); box-shadow: var(--inset); color: var(--accent); }
  .stat .ico svg { width: 21px; height: 21px; }
  .stat .n { display: block; font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .stat .l { display: block; font-size: .72rem; font-weight: 700; color: var(--muted); margin-top: 3px; }
  .stat.bad .n, .stat.bad .ico { color: var(--red); } .stat.warn .n, .stat.warn .ico { color: var(--amber); }
  .stat.good .n, .stat.good .ico { color: var(--green); } .stat.info .n { color: var(--text); }

  /* ---- profile card ---------------------------------------------------- */
  .profile-card { display: flex; align-items: center; gap: 22px; padding: 24px; margin: .8rem auto 0; border-radius: 32px;
    background: var(--card); border: 1px solid var(--border); box-shadow: var(--raise); }
  .profile-card .info { min-width: 0; }
  .profile-card .name { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
  .profile-card .email { color: var(--muted); overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; padding: 4px 12px;
    border-radius: 999px; background: var(--green-soft); color: var(--green); margin-top: .6rem; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---- badges ---------------------------------------------------------- */
  .badge { display: inline-block; font-size: .7rem; padding: 3px 11px; border-radius: 999px; font-weight: 700; vertical-align: 1px; margin-right: 4px; }
  .badge.overdue, .badge.missed, .badge-reauth_required, .badge-config_error, .badge.status-MISSED { background: var(--red-soft); color: var(--red); }
  .badge.due, .badge-degraded { background: var(--amber-soft); color: var(--amber); }
  .badge.actual, .badge.status-DISCOVERED, .badge.status-ACTION_REQUIRED, .badge.status-PLANNED, .badge.status-IN_PROGRESS { background: var(--blue-soft); color: var(--blue); }
  .badge.personal { background: var(--accent-soft); color: var(--accent); }
  .badge.done, .badge.handled, .badge-healthy, .badge.status-COMPLETED { background: var(--green-soft); color: var(--green); }
  .badge-not_connected, .badge.status-CANCELLED { background: var(--surface-2); color: var(--muted); }
  .ok { color: var(--green); font-weight: 700; }
  .failed, .error { color: var(--red); font-weight: 600; }

  /* ---- controls: raised buttons, pressed-in inputs --------------------- */
  button, .btn { cursor: pointer; font: inherit; font-size: .84rem; font-weight: 650; border: 1px solid var(--border);
    background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 18px; white-space: nowrap;
    box-shadow: var(--raise-sm); transition: box-shadow .15s, transform .1s; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { box-shadow: var(--raise); }
  button:active, .btn:active { box-shadow: var(--inset); transform: scale(.98); }
  section button[type=submit], .new-task button[type=submit], .btn-primary { background: var(--grad); border-color: transparent;
    color: #fff; margin-top: 1rem; box-shadow: 0 12px 22px -10px rgba(108,99,245,.85); }
  section button[type=submit]:hover, .btn-primary:hover { filter: brightness(1.06); box-shadow: 0 14px 26px -10px rgba(108,99,245,.95); }
  .task button[type=submit] { color: var(--green); }
  .task button[type=submit]:hover { background: var(--green-soft); }
  input[type=text], input[type=date], input[type=email], select, textarea { font: inherit; font-size: .9rem; color: var(--text);
    background: var(--surface); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 11px 14px;
    box-shadow: var(--inset); transition: box-shadow .15s, border-color .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=checkbox] { accent-color: var(--accent); width: 17px; height: 17px; }
  section { padding: 22px; margin: 14px auto; }
  section label, .fold label { display: block; font-size: .8rem; font-weight: 650; color: var(--muted); margin-top: .9rem; }
  section input[type=text], section textarea, section select,
  .fold form input[type=text], .fold form textarea, .fold form select { width: 100%; margin-top: 6px; }
  textarea { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: .85rem; }
  .checkbox-row { display: flex; align-items: center; gap: .55rem; margin-top: .8rem; }
  .checkbox-row label { margin: 0; color: var(--text); }
  .service-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 0; border-bottom: 1px solid var(--line); }
  .service-row:last-of-type { border-bottom: 0; }
  .service-row .name { font-weight: 750; margin-right: .4rem; }
  .status-line { padding: .25rem 0; }
  form.inline { display: inline; }
  form.inline input[type=date] { padding: 6px 10px; }
  .danger-fold { background: var(--red-soft); border-color: transparent; }
  .danger { background: var(--red-soft); border-color: transparent; box-shadow: none; }
  .danger a { color: var(--red); }
  .danger button, button.btn-danger { background: var(--red); border-color: var(--red); color: #fff; box-shadow: none; }
  .danger-heading { color: var(--red); }
  pre { white-space: pre-wrap; font: .85rem ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface);
    box-shadow: var(--inset); border-radius: var(--radius-sm); padding: 1rem; }
  a.back { display: inline-block; color: var(--muted); font-size: .85rem; text-decoration: none; margin-top: .3rem; }
  a.back:hover { color: var(--accent); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; font-size: .88rem; margin-top: 1rem; box-shadow: var(--raise-sm); }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; background: var(--surface-2); }
  tr:last-child td { border-bottom: 0; }

  /* ---- public pages (landing, help, policy) ---------------------------- */
  .landing { text-align: center; padding: 40px 20px 26px; }
  .landing .logo { width: 64px; height: 64px; font-size: 1.8rem; border-radius: 22px; margin: 0 auto 1.1rem; }
  .landing h1 { font-size: 2.5rem; }
  .landing .lead { font-size: 1.1rem; color: var(--muted); max-width: 500px; margin: .6rem auto 1.5rem; }
  .cta { display: inline-block; padding: .85rem 1.8rem; background: var(--grad); color: #fff; border-radius: 999px;
    text-decoration: none; font-weight: 700; box-shadow: 0 16px 28px -12px rgba(108,99,245,.9); transition: transform .15s, filter .15s; }
  .cta:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 1.4rem auto; text-align: left; }
  .feature { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--raise-sm); }
  .feature b { display: block; margin-bottom: 4px; }
  .feature span { color: var(--muted); font-size: .9rem; }
  .doc { background: var(--card); border: 1px solid var(--border); border-radius: 32px; padding: 12px 30px 26px; box-shadow: var(--raise); }
  .doc h1 { margin-top: 1.3rem; }
  .foot { text-align: center; color: var(--muted); font-size: .84rem; margin-top: 1.6rem; }
  .foot a { color: var(--muted); }

  /* ---- phone: floating bottom dock with a raised centre button --------- */
  @media (max-width: 760px) {
    body { padding: 78px 14px 120px; }
    h1 { font-size: 1.65rem; }
    .appbar { top: 8px; left: 8px; right: 8px; }
    .appbar .tabs { display: none; }
    .appbar-inner { justify-content: space-between; }
    .nav-user .who { display: none; } .nav-user { padding: 3px; }
    .dock { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 30;
      align-items: center; justify-content: space-around; padding: 10px 8px; border-radius: 30px; background: var(--dock-bg);
      border: 1px solid var(--border); box-shadow: var(--raise); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
    .dock a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); text-decoration: none;
      font-size: .66rem; font-weight: 650; min-width: 54px; padding: 4px 0; }
    .dock a svg { width: 22px; height: 22px; }
    .dock a.on { color: var(--accent); }
    .dock a.center { width: 62px; height: 62px; min-width: 62px; margin-top: -34px; border-radius: 50%; background: var(--grad); color: #fff;
      justify-content: center; box-shadow: 0 14px 24px -8px rgba(108,99,245,.9), 0 0 0 6px var(--bg); }
    .dock a.center svg { width: 26px; height: 26px; }
    .task { flex-direction: column; align-items: stretch; }
    .stats { grid-template-columns: repeat(2, 1fr); }
